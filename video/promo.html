<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--bg:#0c0e1a;--ink:#e7e9f5;--mut:#a0a8c2;--p:#a99cff;--p2:#7fb2ff;--card:#161a2c;--line:#272c45;--ok:#6fdc9e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;inset:0}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(140px);pointer-events:none}
.g1{background:#5745cb;opacity:.28;left:-300px;top:-200px}
.g2{background:#1b6f87;opacity:.22;right:-300px;bottom:-200px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#0c0e1a 100%)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px;opacity:0;will-change:opacity,transform}
h1,h2,.big,.mono{font-family:'Space Grotesk',sans-serif;font-weight:500;letter-spacing:-.06em;line-height:1.02}
.mono{font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;letter-spacing:0}
.brand{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;font-size:36px;font-weight:600;letter-spacing:-.02em}
.brand b{font-family:'Space Grotesk';font-size:74px;color:var(--p);line-height:1}
.brand small{display:block;font-size:24px;font-weight:400;color:var(--mut);letter-spacing:0;margin-top:4px}
.line{display:block;white-space:pre}
.mark{color:var(--p);background:linear-gradient(#3b3278,#3b3278) no-repeat 0 88%/var(--mw,0%) 36%}
.sub{font-size:42px;color:var(--mut);margin-top:50px;line-height:1.35;white-space:nowrap}
.sub b{color:var(--ink);font-weight:500}
.foot{position:absolute;bottom:130px;left:0;right:0;text-align:center;font-size:30px;color:var(--mut);letter-spacing:.02em}
.foot b{color:var(--ink);font-weight:500}
.hook{font-size:132px}
.hook em{font-style:normal;color:var(--p)}
.q{font-size:150px;color:var(--p);margin-top:30px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:60px;max-width:900px}
.chip{border:2px solid var(--line);border-radius:999px;padding:18px 34px;font-size:32px;color:var(--mut);background:#161a2ccc;opacity:0}
.price{font-size:260px;line-height:.95;background:linear-gradient(135deg,#fff,#c9bfff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:50px}
.price small{font-size:100px;vertical-align:top;line-height:2.3;margin-right:10px}
.pl{font-size:36px;color:var(--mut);margin-top:-10px}
.num{font-size:330px;line-height:.9;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.unit{font-size:70px}
.steps{display:flex;gap:22px;margin-top:70px;width:920px}
.steps div{flex:1;background:#161a2ccc;border:2px solid var(--line);border-radius:18px;padding:26px 24px;text-align:left;opacity:0}
.steps b{display:block;font-family:ui-monospace,monospace;color:var(--p);font-size:26px;margin-bottom:12px}
.steps span{font-size:28px;line-height:1.3;display:block}
.shots{position:absolute;inset:0}
.shot{position:absolute;width:720px;left:180px;border-radius:22px;overflow:hidden;border:2px solid var(--line);box-shadow:0 60px 120px #0009;background:var(--card);opacity:0}
.shot img{display:block;width:100%;height:auto}
.shot .bar{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:2px solid var(--line);font-size:24px;color:var(--mut);background:var(--card)}
.shot .bar i{width:14px;height:14px;border-radius:50%;background:var(--ok)}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:60px;background:#5b49d6;color:#fff;font-size:46px;font-weight:500;padding:40px 60px;border-radius:18px;box-shadow:0 30px 80px #5745cb66;margin-top:70px}
.url{font-size:62px;letter-spacing:-.03em;margin-top:40px}
.url b{color:var(--ink);font-weight:500}
.cursor{position:absolute;width:44px;height:52px;left:0;top:0;filter:drop-shadow(0 8px 16px #0008);opacity:0}
.avatar{position:absolute;right:70px;bottom:230px;width:300px;height:300px;border-radius:50%;overflow:hidden;border:3px solid var(--line);box-shadow:0 30px 80px #000a;opacity:0;background:#0c0e1a}
.avatar video,.avatar img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<div class="stage">
  <div class="glow g1"></div><div class="glow g2"></div>
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="vig"></div>
  <div class="brand" id="brand"><b>t.</b><span><span id="bname"></span><small id="brole"></small></span></div>

  <section class="scene" id="hook">
    <h1 class="hook"><span class="line" id="k1"></span><span class="line" id="k2"></span><span class="line" id="k3"></span></h1>
    <div class="q mono" id="kq"></div>
  </section>

  <section class="scene" id="offer">
    <h1 style="font-size:140px"><span class="line" id="o1"></span><span class="line" id="o2"></span><span class="line"><span class="mark" id="o3"></span><span id="o4"></span></span></h1>
    <div class="chips" id="chips"></div>
    <div class="price"><small>R$</small><span class="mono" id="price">600</span></div>
    <div class="pl" id="pl"></div>
  </section>

  <section class="scene" id="process">
    <p class="sub" style="margin:0 0 10px" id="pr0"></p>
    <div class="num mono" id="num">35</div>
    <div class="unit" id="pr1"></div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="scene" id="projects">
    <div class="shots">
      <div class="shot" id="sh1"><img src="../public/portfolio/prumo.webp"><div class="bar"><i></i>plataformaprumo.com.br</div></div>
      <div class="shot" id="sh2"><img src="../public/portfolio/radar-clientes.webp"><div class="bar"><i></i>radardecliente.com.br</div></div>
      <div class="shot" id="sh3"><img src="../public/portfolio/emile.webp"><div class="bar"><i></i>draemilevitoria.com.br</div></div>
      <div class="shot" id="sh4"><img src="../public/portfolio/arouche.webp"><div class="bar"><i></i>arouchemodaintima.com.br</div></div>
    </div>
    <h2 style="font-size:110px;position:absolute;top:360px;left:80px;right:80px" id="pj"></h2>
  </section>

  <section class="scene" id="close">
    <h2 style="font-size:116px"><span class="line" id="c1"></span><span class="line" id="c2"></span></h2>
    <p class="url"><b id="c3"></b></p>
    <div class="cta" id="cta"><span id="c4"></span><span>↗</span></div>
  </section>

  <div class="foot" id="foot"></div>
  <div class="avatar" id="avatar"></div>
  <svg class="cursor" id="cur" viewBox="0 0 24 28"><path d="M4 2 L4 22 L9.5 17 L13 25 L16.5 23.5 L13 15.5 L20 15.5 Z" fill="#fff" stroke="#182947" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script src="common.js"></script>
<script>
// ---------- Roteiro (durações vêm do áudio: ?d=hook,offer,process,projects,close em segundos) ----------
const FPS = 30
const q = new URLSearchParams(location.search)
const D = (q.get('d') || '2.6,9.5,6.5,4.2,5.5').split(',').map(Number)
const LEAD = 0.5 // o vídeo começa meio segundo antes da primeira fala
const names = ['hook', 'offer', 'process', 'projects', 'close']
const S = {}; let acc = LEAD
names.forEach((n, i) => { S[n] = [acc, acc + D[i]]; acc += D[i] })
const TOTAL = acc + 1.2
window.TOTAL = TOTAL
const sceneAlpha = (t, [a, b]) => Math.min(span(t, a - 0.3, 0.45), 1 - span(t, b - 0.35, 0.35))
const setScene = (id, t) => {
  const el = $(id), [a, b] = S[id]
  el.style.opacity = sceneAlpha(t, S[id])
  el.style.transform = `scale(${1 + 0.05 * span(t, b - 0.35, 0.35)}) translateY(${(1 - span(t, a - 0.3, 0.8)) * 40}px)`
  return t >= a - 0.3 && t <= b
}
const chips = ['Design', 'Textos prontos', 'Versão celular', 'Domínio .com.br', 'WhatsApp']
$('chips').innerHTML = chips.map(() => `<span class="chip"></span>`).join('')
const chipEls = [...document.querySelectorAll('.chip')]
const steps = [['01', 'Você conta o que faz'], ['02', 'Primeira versão em 35h'], ['03', 'No ar em até 5 dias']]
$('steps').innerHTML = steps.map(s => `<div><b>${s[0]}</b><span></span></div>`).join('')
const stepEls = [...document.querySelectorAll('.steps div')]

window.render = (frame) => {
  const t = frame / FPS
  if (frame === 6) ripple(540, 960, 1.6)
  for (const k of names.slice(1)) if (frame === Math.round(S[k][0] * FPS)) ripple(540, k === 'close' ? 1000 : 760, 1.3)
  for (let n = 0; n < 3; n++) {
    const o = n * 2.1, tm = frame * 33.3
    const pos = m => [W * (0.5 + 0.4 * Math.sin(m * 0.0011 + o) * Math.cos(m * 0.0004 + o * 0.5)), H * (0.5 + 0.38 * Math.sin(m * 0.00075 + 1.3 + o))]
    const [ax, ay] = pos(tm), [bx, by] = pos(tm - 16)
    splat(ax, ay, (ax - bx) * 4, (ay - by) * 4, 0.42, 120)
  }
  // cursor atravessa o título da oferta
  const cur = $('cur'); const o0 = S.offer[0]
  if (t > o0 + 0.6 && t < o0 + 2.0) {
    const p = easeIO(span(t, o0 + 0.6, 1.1)), x = 160 + 760 * p, y = 640 + Math.sin(p * Math.PI * 1.6) * 150 + p * 120
    cur.style.opacity = Math.min(span(t, o0 + 0.6, 0.2), 1 - span(t, o0 + 1.7, 0.3)); cur.style.transform = `translate(${x}px,${y}px)`
    splat(x, y, 6, -4, 0.5, 110)
  } else cur.style.opacity = 0
  // mouse passeando nos prints
  const pj0 = S.projects[0]
  if (t > pj0 + 0.8 && t < S.projects[1]) { const p = span(t, pj0 + 0.8, S.projects[1] - pj0 - 0.8); splat(200 + 680 * p, 1400 - 500 * Math.sin(p * Math.PI), 6, -4, 0.3, 90) }

  stepField()
  const fade = Math.min(span(t, 0, 0.8), 1 - span(t, TOTAL - 0.6, 0.6))
  drawField(frame, 1)
  $('c').style.opacity = fade
  document.querySelector('.stage').style.filter = `brightness(${0.2 + 0.8 * fade})`

  $('bname').textContent = decode('Thierry Araújo', span(t, 0.3, 1.2), frame)
  $('brole').textContent = decode('Desenvolvedor web', span(t, 0.7, 1.2), frame)
  $('brand').style.opacity = Math.min(span(t, 0.2, 0.5), 1 - span(t, TOTAL - 0.8, 0.5))
  $('foot').innerHTML = `<b>thierryaraujodev.com.br</b> · PT / EN`
  $('foot').style.opacity = Math.min(span(t, 1.5, 0.6), 1 - span(t, S.close[0] - 0.3, 0.3))
  $('avatar').style.opacity = q.get('av') ? Math.min(span(t, 0.6, 0.6), 1 - span(t, TOTAL - 0.9, 0.5)) : 0

  // gancho
  if (setScene('hook', t)) {
    const a = S.hook[0]
    $('k1').textContent = decode('Seu negócio', span(t, a - 0.2, 0.8), frame)
    $('k2').textContent = decode('ainda não tem', span(t, a + 0.2, 0.8), frame)
    $('k3').innerHTML = '<em>' + decode('um site', span(t, a + 0.6, 0.8), frame) + '</em>'
    $('kq').textContent = t > a + 1.3 ? '?' : ''
    $('kq').style.transform = `scale(${0.6 + 0.4 * ease(span(t, a + 1.3, 0.4))})`
  }
  // oferta
  if (setScene('offer', t)) {
    const a = S.offer[0]
    $('o1').textContent = decode('Seu site', span(t, a - 0.2, 0.9), frame)
    $('o2').textContent = decode('no ar em', span(t, a + 0.1, 0.9), frame)
    $('o3').textContent = decode('até 5 dias', span(t, a + 0.4, 1.0), frame)
    $('o4').textContent = t > a + 1.4 ? '.' : ''
    $('o3').style.setProperty('--mw', `${ease(span(t, a + 1.4, 0.6)) * 100}%`)
    const d = D[1]
    chipEls.forEach((el, i) => { const p = span(t, a + d * 0.3 + i * 0.28, 0.6); el.style.opacity = p; el.style.transform = `translateY(${(1 - ease(p)) * 24}px)`; el.textContent = decode(chips[i], p, frame) })
    const pp = span(t, a + d * 0.72, 0.5)
    document.querySelector('.price').style.opacity = pp
    document.querySelector('.price').style.transform = `scale(${0.8 + 0.2 * ease(pp)})`
    $('price').textContent = t < a + d * 0.72 + 0.4 ? decode('600', span(t, a + d * 0.72, 0.4), frame, 1) : '600'
    $('pl').textContent = decode('tudo incluso, domínio no seu nome', span(t, a + d * 0.72 + 0.5, 1.0), frame)
  }
  // processo
  if (setScene('process', t)) {
    const a = S.process[0]
    $('pr0').textContent = decode('Primeira versão em', span(t, a - 0.2, 0.9), frame)
    const v = Math.round(35 * ease(span(t, a + 0.3, 1.2)))
    $('num').textContent = String(v).padStart(2, '0')
    $('pr1').textContent = decode('horas', span(t, a + 0.9, 0.7), frame)
    stepEls.forEach((el, i) => { const p = ease(span(t, a + 2.2 + i * 0.5, 0.6)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 30}px)`; el.querySelector('span').textContent = decode(steps[i][1], p, frame) })
  }
  // projetos
  if (setScene('projects', t)) {
    const a = S.projects[0]
    $('pj').textContent = decode('Sites no ar. Pode entrar.', span(t, a - 0.2, 1.2), frame)
    const shots = [['sh1', 0.2, 640], ['sh2', 0.9, 830], ['sh3', 1.6, 1020], ['sh4', 2.3, 1210]]
    shots.forEach(([id, d, top], i) => {
      const p = ease(span(t, a + d, 0.9)), el = $(id)
      el.style.top = `${top + (1 - p) * 420}px`; el.style.opacity = p
      el.style.transform = `rotate(${(i % 2 ? 1 : -1) * 2.5 * p}deg) scale(${0.9 + 0.1 * p})`; el.style.zIndex = i
    })
  }
  // fechamento
  if (setScene('close', t)) {
    const a = S.close[0]
    $('c1').textContent = decode('Vamos colocar seu', span(t, a - 0.2, 1.0), frame)
    $('c2').textContent = decode('negócio no ar?', span(t, a + 0.1, 1.0), frame)
    $('c3').textContent = decode('thierryaraujodev.com.br', span(t, a + 0.6, 1.4), frame)
    const p = ease(span(t, a + 2.2, 0.8))
    $('cta').style.opacity = p; $('cta').style.transform = `translateY(${(1 - p) * 50}px) scale(${0.9 + 0.1 * p})`
    $('c4').textContent = decode('Chamar no WhatsApp', span(t, a + 2.4, 1), frame)
  }
}
</script>
</body></html>
