<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
/* mesmas cores do tema claro do site */
:root{--bg:#f5f7fc;--card:#fff;--line:#dce2ef;--txt:#182947;--mut:#596981;--p:#5745cb;--p2:#394fb1;--soft:#eef0fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--txt)}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
.g{font-family:'Space Grotesk',sans-serif;font-weight:500;letter-spacing:-.06em;line-height:1}
.abs{position:absolute}
.center{left:0;right:0;text-align:center}
.shadow{box-shadow:0 30px 70px #18294714,0 2px 6px #1829470d}
/* marca */
.brand{position:absolute;top:120px;left:0;right:0;display:flex;justify-content:center}
.brand div{display:flex;align-items:center;gap:16px;padding:12px 30px 12px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:30px;font-weight:500}
.brand i{width:52px;height:52px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-style:normal;font-family:'Space Grotesk';font-weight:700;font-size:28px;color:#fff}
.brand span b{color:var(--p);font-weight:600}
/* legenda */
.cap{position:absolute;top:1450px;left:60px;right:60px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-family:'Space Grotesk';font-weight:700;font-size:74px;letter-spacing:-.04em;line-height:1.18}
.cap span{display:inline-block;padding:2px 16px;border-radius:16px;color:var(--txt)}
.cap span.on{background:var(--p);color:#fff}
/* 1: feed */
.phone{position:absolute;left:270px;top:300px;width:540px;height:1000px;border-radius:64px;background:#fff;border:6px solid var(--txt);overflow:hidden}
.notch{position:absolute;top:18px;left:50%;width:150px;height:34px;margin-left:-75px;border-radius:20px;background:var(--txt);z-index:3}
.feed{position:absolute;left:28px;right:28px;top:0}
.post{height:400px;margin-bottom:24px;border-radius:30px;padding:22px;position:relative;overflow:hidden;background:var(--soft);border:2px solid var(--line)}
.post .who{display:flex;align-items:center;gap:14px}
.post .who i{width:52px;height:52px;border-radius:50%;background:#d5daea}
.post .who u{display:block;width:150px;height:16px;border-radius:8px;background:#d5daea;text-decoration:none}
.post .ln{position:absolute;left:22px;bottom:26px;width:60%;height:14px;border-radius:7px;background:#d5daea}
.post .ln2{bottom:52px;width:80%}
.hero{background:var(--p);border-color:var(--p)}
.hero svg{position:absolute;inset:0}
.flash{position:absolute;inset:0;border-radius:58px;box-shadow:inset 0 0 0 8px var(--p);opacity:0}
/* 2: motion */
.word{position:absolute;top:560px;left:0;right:0;display:flex;justify-content:center;font-size:250px;font-weight:700}
.word span{display:inline-block;color:var(--txt)}
.word span.o{color:var(--p)}
.outline{position:absolute;top:830px;left:0;right:0;text-align:center;font-size:190px;color:transparent;-webkit-text-stroke:3px var(--txt)}
.watch{position:absolute;left:390px;top:1090px;width:300px;height:300px}
/* 3: nichos */
.h3{top:270px;font-size:84px}
.h3 em{font-style:normal;color:var(--p)}
.browser{position:absolute;left:160px;top:470px;width:760px;height:760px;border-radius:30px;background:#fff;border:2px solid var(--line);overflow:hidden}
.bbar{display:flex;align-items:center;gap:10px;height:64px;padding:0 26px;border-bottom:2px solid var(--line)}
.bbar i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.bbar span{margin-left:16px;flex:1;height:36px;border-radius:999px;background:var(--bg);font-size:22px;color:var(--mut);line-height:36px;padding-left:22px}
.bnav{display:flex;gap:22px;padding:28px 40px}
.bnav u{display:block;width:90px;height:14px;border-radius:7px;background:var(--line)}
.bnav u:first-child{width:60px;background:var(--txt);margin-right:auto}
.bhero{position:relative;margin:0 40px;height:300px;border-radius:22px;background:var(--soft);overflow:hidden}
.bhero svg{position:absolute;inset:0}
.bt{position:absolute;left:36px;top:60px;width:360px;height:30px;border-radius:15px;background:var(--txt)}
.bt2{top:110px;width:260px}
.bbtn{position:absolute;left:36px;top:180px;width:190px;height:56px;border-radius:999px;background:var(--p)}
.bcols{display:flex;gap:24px;margin:30px 40px}
.bcols div{flex:1;height:200px;border-radius:20px;background:var(--bg);border:2px solid var(--line)}
.niche{position:absolute;width:430px;height:280px;border-radius:32px;background:#fff;border:2px solid var(--line);overflow:hidden}
.niche svg{position:absolute;left:30px;top:30px;width:140px;height:140px}
.niche b{position:absolute;left:34px;bottom:30px;font-family:'Space Grotesk';font-weight:500;font-size:48px;letter-spacing:-.04em}
.niche .n{position:absolute;right:30px;top:30px;font-size:26px;color:var(--mut);font-variant-numeric:tabular-nums}
/* 4: formatos */
.pills{position:absolute;top:270px;left:0;right:0;display:flex;justify-content:center;gap:18px}
.pill{padding:18px 34px;border-radius:999px;background:#fff;border:2px solid var(--line);font-family:'Space Grotesk';font-weight:500;font-size:40px;letter-spacing:-.03em}
.pill.on{background:var(--txt);border-color:var(--txt);color:#fff}
.panel{position:absolute;left:80px;top:400px;width:920px;height:560px;border-radius:36px;background:#fff;border:2px solid var(--line);overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;height:80px;padding:0 34px;border-bottom:2px solid var(--line);font-size:28px;color:var(--mut)}
.ph i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.ph i:nth-child(3){margin-right:14px}
.ph em{margin-left:auto;font-style:normal;color:var(--txt);font-variant-numeric:tabular-nums}
.track{position:absolute;left:0;right:0;height:140px;display:flex;align-items:center}
.track label{width:210px;padding-left:34px;font-size:32px;font-weight:600}
.lane{position:relative;flex:1;height:96px;margin-right:34px;border-radius:18px;background:var(--bg);overflow:hidden}
.playhead{position:absolute;top:80px;bottom:0;width:4px;margin-left:-2px;background:var(--p)}
.playhead:before{content:'';position:absolute;top:-2px;left:-12px;width:28px;height:28px;background:var(--p);transform:rotate(45deg) scale(.7)}
.fmt{position:absolute;left:0;right:0;top:1000px;height:420px}
.frame{position:absolute;left:50%;top:170px;border-radius:24px;background:#fff;border:5px solid var(--txt);display:grid;place-items:center}
.frame:after{content:'';width:0;height:0;border-left:40px solid var(--p);border-top:26px solid transparent;border-bottom:26px solid transparent;margin-left:12px}
.fl{position:absolute;left:0;right:0;top:370px;text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:42px}
.fl small{color:var(--mut);font-family:Inter;font-weight:500;font-size:32px;margin-left:12px}
/* 5: fechamento */
.mini{position:absolute;left:290px;top:430px;width:500px;height:880px;border-radius:60px;border:6px solid var(--txt);overflow:hidden;background:#fff}
.q{top:250px;font-size:120px}
.q em{font-style:normal;color:var(--p)}
.logo{position:absolute;left:390px;top:330px;width:300px;height:300px}
.logo .disc{position:absolute;inset:34px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:140px;letter-spacing:-.06em;color:#fff}
.logo svg{position:absolute;inset:0}
.name{top:700px;font-size:100px}
.role{top:820px;font-size:40px;color:var(--mut);font-weight:500}
.role b{color:var(--txt);font-weight:600}
.wa{position:absolute;left:150px;top:960px;width:780px;height:150px;border-radius:999px;background:var(--p);display:flex;align-items:center;justify-content:center;gap:24px;font-size:50px;font-weight:600;color:#fff}
.wa svg{width:66px;height:66px}
.ring{position:absolute;left:150px;top:960px;width:780px;height:150px;border-radius:999px;border:3px solid var(--p)}
.contact{top:1160px;font-size:40px;color:var(--mut);line-height:1.5}
.contact b{color:var(--txt);font-weight:600}
</style></head><body>
<div class="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>

  <section class="scene" id="hook">
    <div class="phone shadow" id="phone">
      <div class="notch"></div>
      <div class="feed" id="feed"></div>
      <div class="flash" id="flash"></div>
    </div>
  </section>

  <section class="scene" id="reveal">
    <div class="word g" id="mword"></div>
    <div class="outline g" id="dword">design</div>
    <svg class="watch" id="watch" viewBox="0 0 300 300"></svg>
  </section>

  <section class="scene" id="niches">
    <h2 class="abs center g h3" id="nh0">Além de <em>sites</em>,</h2>
    <h2 class="abs center g h3" id="nh1">também <em>motion</em></h2>
    <h2 class="abs center g h3" id="nh">Para <em>diversos</em> nichos</h2>
    <div class="browser shadow" id="browser">
      <div class="bbar"><i></i><i></i><i></i><span>seunegocio.com.br</span></div>
      <div class="bnav"><u></u><u></u><u></u><u></u></div>
      <div class="bhero" id="bhero"><div class="bt"></div><div class="bt bt2"></div><div class="bbtn"></div><svg viewBox="0 0 680 300" id="bart"></svg></div>
      <div class="bcols"><div></div><div></div><div></div></div>
    </div>
    <div id="grid"></div>
  </section>

  <section class="scene" id="details">
    <div class="pills" id="pills"></div>
    <div class="panel shadow" id="panel">
      <div class="ph"><i></i><i></i><i></i>Seu vídeo · Reels<em id="tc">00:00</em></div>
      <div class="track" style="top:100px" id="t0"><label>Roteiro</label><div class="lane" id="l0"></div></div>
      <div class="track" style="top:250px" id="t1"><label>Narração</label><div class="lane" id="l1"></div></div>
      <div class="track" style="top:400px" id="t2"><label>Trilha</label><div class="lane" id="l2"></div></div>
      <div class="playhead" id="ph"></div>
    </div>
    <div class="fmt" id="fmt"><div class="frame shadow" id="frame"></div><div class="fl" id="fl"></div></div>
  </section>

  <section class="scene" id="close">
    <h2 class="abs center g q" id="q">Este <em>vídeo</em>?</h2>
    <div class="mini shadow" id="mini"><svg viewBox="0 0 500 880" width="500" height="880" id="minisvg"></svg></div>
    <div class="logo" id="logo"><svg viewBox="0 0 300 300" id="logosvg"></svg><div class="disc">t.</div></div>
    <h2 class="abs center g name" id="name">Thierry Araújo</h2>
    <p class="abs center role" id="role"><b>Motion design</b> · vídeos · sites</p>
    <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
    <div class="wa shadow" id="wa"><svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.8.8a3.3 3.3 0 0 0 2.1-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4z"/></svg>Chamar no WhatsApp</div>
    <p class="abs center contact" id="contact"><b>(95) 99143-2677</b><br>thierryaraujodev.com.br</p>
  </section>

  <canvas id="fx" width="1080" height="1920"></canvas>
  <div class="brand" id="brand"><div><i>t.</i><span>Thierry Araújo · <b>Motion</b></span></div></div>
  <div class="cap" id="cap"></div>
</div>
<script src="out/motion/timing.js" onerror="void 0"></script>
<script>
// ---------- Utilidades (tudo é função do quadro, para o render ser determinístico) ----------
const FPS = 30, W = 1080, H = 1920
const $ = id => document.getElementById(id)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const span = (t, a, d) => clamp((t - a) / d, 0, 1)
const ease = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3)
const easeIO = p => { p = clamp(p, 0, 1); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 }
const spring = u => u <= 0 ? 0 : 1 - Math.exp(-6 * u) * Math.cos(10 * u) // u em segundos; passa um pouco do alvo e assenta
const lerp = (a, b, p) => a + (b - a) * p
const hash = n => { let h = (n * 374761393 + 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296 }
const INK = '#182947', P = '#5745cb', P2 = '#394fb1', LINE = '#dce2ef'

// ---------- Tempo das cenas (vem da narração: out/motion/timing.js) ----------
const LEAD = 0.4, GAP = 0.5, TAIL = 1.6 // os mesmos valores de build-motion.sh
const NARR = window.NARR || { scenes: [
  { id: 'hook', duration: 3.6, words: [] }, { id: 'reveal', duration: 6.84, words: [] }, { id: 'niches', duration: 11.18, words: [] },
  { id: 'details', duration: 8.05, words: [] }, { id: 'close', duration: 7.78, words: [] }] }
const S = {}, names = []; let acc = LEAD
NARR.scenes.forEach(s => { names.push(s.id); S[s.id] = { a: acc, b: acc + s.duration + GAP, words: s.words.map(w => ({ ...w, s: w.s + acc, e: w.e + acc })) }; acc += s.duration + GAP })
const TOTAL = acc + TAIL; window.TOTAL = TOTAL
// momento em que a palavra é falada (cai num ponto proporcional da cena se não houver marcação)
const wt = (id, word, frac = 0.5) => { const w = S[id].words.find(x => x.w.toLowerCase().replace(/[.,?!:]/g, '') === word); return w ? w.s : lerp(S[id].a, S[id].b, frac) }
const CUT = 0.22 // a troca de cena acontece escondida pela cortina, um pouco antes da fala
const sceneOf = t => { let cur = names[0]; for (const n of names) if (t >= S[n].a - CUT) cur = n; return cur }

// ---------- Fundo claro: grade fina, formas de contorno flutuando e explosões discretas ----------
const bg = $('bg').getContext('2d'), fx = $('fx').getContext('2d')
const SHAPES = Array.from({ length: 14 }, (_, i) => ({ type: i % 4, x: hash(i * 7 + 1) * W, y: hash(i * 7 + 2) * H, size: 18 + hash(i * 7 + 3) * 26, color: i % 3 ? INK : P, rot: (hash(i * 7 + 4) - .5) * 1.2, sp: 14 + hash(i * 7 + 5) * 28, ph: hash(i * 7 + 6) * 6 }))
const drawShape = (c, type, s) => {
  c.beginPath()
  if (type === 0) c.arc(0, 0, s, 0, Math.PI * 2)
  else if (type === 1) { c.moveTo(-s, 0); c.lineTo(s, 0); c.moveTo(0, -s); c.lineTo(0, s) }
  else if (type === 2) { for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / 3; c[k ? 'lineTo' : 'moveTo'](Math.cos(a) * s, Math.sin(a) * s) } c.closePath() }
  else c.rect(-s * .8, -s * .8, s * 1.6, s * 1.6)
}
const bursts = []
const drawBursts = (c, t) => {
  for (const b of bursts) {
    const dt = t - b.t; if (dt < 0 || dt > 1.8) continue
    for (let i = 0; i < b.n; i++) {
      const h1 = hash(b.seed + i * 3), h2 = hash(b.seed + i * 3 + 1), h3 = hash(b.seed + i * 3 + 2)
      const ang = h1 * Math.PI * 2, v = (380 + h2 * 800) * b.power, k = 3.2, d = v * (1 - Math.exp(-k * dt)) / k
      c.save(); c.translate(b.x + Math.cos(ang) * d, b.y + Math.sin(ang) * d + 80 * dt * dt); c.rotate(dt * (h3 - .5) * 8)
      c.globalAlpha = clamp(1 - dt / 1.6, 0, 1) * 0.9
      const col = i % 3 ? P : INK, type = i % 4
      c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 5
      drawShape(c, type, 8 + h3 * 12); type === 1 || type === 0 ? c.stroke() : c.fill()
      c.restore()
    }
  }
}
const drawBg = t => {
  bg.fillStyle = '#f5f7fc'; bg.fillRect(0, 0, W, H)
  const x = W * (0.5 + 0.35 * Math.sin(t * 0.25)), y = H * (0.42 + 0.2 * Math.cos(t * 0.2))
  const g = bg.createRadialGradient(x, y, 0, x, y, 800); g.addColorStop(0, '#5745cb14'); g.addColorStop(1, '#5745cb00')
  bg.fillStyle = g; bg.fillRect(0, 0, W, H)
  bg.strokeStyle = '#18294712'; bg.lineWidth = 2
  const off = (t * 16) % 90
  bg.beginPath()
  for (let gx = 0; gx <= W; gx += 90) { bg.moveTo(gx, 0); bg.lineTo(gx, H) }
  for (let gy = -90 + off; gy <= H; gy += 90) { bg.moveTo(0, gy); bg.lineTo(W, gy) }
  bg.stroke()
  for (const s of SHAPES) {
    const yy = ((s.y - t * s.sp) % (H + 200) + H + 200) % (H + 200) - 100, xx = s.x + Math.sin(t * .6 + s.ph) * 26
    bg.save(); bg.translate(xx, yy); bg.rotate(t * s.rot + s.ph); bg.globalAlpha = s.color === P ? 0.22 : 0.1
    bg.strokeStyle = s.color; bg.lineWidth = 4; bg.lineCap = 'round'; bg.lineJoin = 'round'
    drawShape(bg, s.type, s.size); bg.stroke(); bg.restore()
  }
  bg.globalAlpha = 1
  drawBursts(bg, t)
}
// cortina entre cenas: um círculo cobre a tela e outro, vazado, revela a próxima cena
const WIPE = { reveal: [P, 540, 1060], niches: [INK, 0, 0], details: [P, 1080, 1920], close: [INK, 540, 960] }
const drawFx = t => {
  fx.clearRect(0, 0, W, H)
  for (const n of names.slice(1)) {
    const a = S[n].a, [col, ox, oy] = WIPE[n] || [P, 540, 960]
    const R = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) + 20
    const r1 = easeIO(span(t, a - CUT - 0.32, 0.32)) * R, r2 = easeIO(span(t, a - CUT, 0.42)) * R
    if (r1 <= 0 || r2 >= R) continue
    fx.globalCompositeOperation = 'source-over'; fx.fillStyle = col
    fx.beginPath(); fx.arc(ox, oy, r1, 0, Math.PI * 2); fx.fill()
    if (r2 > 0) { fx.globalCompositeOperation = 'destination-out'; fx.beginPath(); fx.arc(ox, oy, r2, 0, Math.PI * 2); fx.fill() }
  }
  fx.globalCompositeOperation = 'source-over'
}

// ---------- Legenda sincronizada com a fala (até 3 palavras por vez) ----------
const chunks = []
for (const n of names) {
  let cur = []
  S[n].words.forEach((w, i) => { cur.push(w); if (cur.length === 3 || /[.,?!:]$/.test(w.w) || i === S[n].words.length - 1) { chunks.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e }); cur = [] } })
}
const drawCaption = t => {
  let c = null
  for (const ch of chunks) if (t >= ch.s - 0.05) c = ch
  const el = $('cap')
  if (!c || t > c.e + 0.5) { el.innerHTML = ''; return }
  const cur = c.words.filter(w => t >= w.s - 0.03).pop() // só a última palavra que começou fica destacada
  el.innerHTML = c.words.map(w => {
    const p = spring(t - w.s + 0.05), on = w === cur && t < w.e + 0.15
    return `<span class="${on ? 'on' : ''}" style="opacity:${clamp((t - w.s + 0.1) * 7, 0, 1)};transform:translateY(${(1 - p) * 24}px)">${w.w}</span>`
  }).join('')
}

// ---------- Cena 1: feed rolando que para de repente ----------
const HERO = 9, POST_H = 424
$('feed').innerHTML = Array.from({ length: 14 }, (_, i) => i === HERO
  ? `<div class="post hero" id="hero"><svg viewBox="0 0 484 400" id="herosvg"></svg><div class="who" style="position:relative"><i style="background:#ffffff66"></i><u style="background:#ffffff66"></u></div></div>`
  : `<div class="post"><div class="who"><i></i><u></u></div><div class="ln ln2"></div><div class="ln"></div></div>`).join('')
const heroArt = u => { // dentro do post em destaque: bola quicando com squash e quadrados girando
  const T = (u * 1.3) % 1, y = 300 - 180 * (1 - Math.pow(2 * T - 1, 2)), sq = T < 0.08 || T > 0.92 ? 1.3 : 1
  let s = `<line x1="40" y1="338" x2="444" y2="338" stroke="#ffffff66" stroke-width="4" stroke-linecap="round"/>`
  for (let i = 0; i < 3; i++) s += `<rect x="${70 + i * 140}" y="80" width="56" height="56" rx="12" fill="none" stroke="#fff" stroke-width="6" transform="rotate(${u * 110 + i * 30} ${98 + i * 140} 108)"/>`
  s += `<ellipse cx="242" cy="${y}" rx="${34 * sq}" ry="${34 / sq}" fill="#fff"/>`
  return s
}
const sceneHook = t => {
  // rola rápido até "parar" e então trava, com um tranco, no post em destaque
  const ts = wt('hook', 'parar', 0.5) + 0.12, target = HERO * POST_H - (1000 - 400) / 2 + 12
  const pos = t < ts ? (t / ts) * (target - 900) : lerp(target - 900, target, spring((t - ts) * 0.9))
  const speed = t < ts ? 1 : clamp(1 - (t - ts) * 4, 0, 1)
  $('feed').style.transform = `translateY(${-pos}px)`
  $('feed').style.filter = `blur(${speed * 4}px)`
  const intro = spring(t - 0.05), tilt = ease(span(t, wt('hook', 'feed', 0.9) - 0.2, 0.6))
  $('phone').style.transform = `translateY(${(1 - intro) * 500}px) rotate(${(1 - intro) * -6 + tilt * 2.5}deg) scale(${1 + 0.05 * ease(span(t, ts, 0.25)) - 0.03 * ease(span(t, ts + 0.25, 0.5))})`
  $('flash').style.opacity = t >= ts ? clamp(1 - (t - ts) * 1.5, 0, 1) : 0
  $('herosvg').innerHTML = heroArt(Math.max(0, t - ts))
}

// ---------- Cena 2: MOTION design ----------
$('mword').innerHTML = 'MOTION'.split('').map(l => `<span class="${l === 'O' ? 'o' : ''}">${l}</span>`).join('')
const letterEls = [...$('mword').children]
const sceneReveal = t => {
  const tm = wt('reveal', 'motion', 0.15) - 0.15, td = wt('reveal', 'design', 0.25), tmv = wt('reveal', 'movimento', 0.36), tsg = wt('reveal', 'segundos', 0.87)
  letterEls.forEach((el, i) => {
    const p = spring(t - tm - i * 0.06), wv = t > tmv ? Math.sin((t - tmv) * 5 - i * 0.8) * ease(span(t, tmv, 0.5)) : 0
    el.style.transform = `translateY(${(1 - p) * -500 + wv * 26}px) rotate(${(1 - p) * (i % 2 ? 18 : -18) + wv * 4}deg)`
    el.style.opacity = clamp((t - tm - i * 0.06) * 6, 0, 1)
  })
  const pd = ease(span(t, td - 0.1, 0.6))
  $('dword').style.clipPath = `inset(0 ${100 - pd * 100}% 0 0)`
  $('dword').style.transform = `translateX(${(1 - pd) * -50}px)`
  // cronômetro que completa a volta em "segundos"
  const pw = spring(t - (tsg - 1.0)), sweep = easeIO(span(t, tsg - 0.7, 1.0)), R = 110, Cc = 2 * Math.PI * R
  $('watch').style.opacity = t > tsg - 1.0 ? 1 : 0
  $('watch').style.transform = `scale(${pw})`
  $('watch').innerHTML = `<circle cx="150" cy="160" r="${R}" fill="#fff" stroke="${LINE}" stroke-width="14"/>
    <circle cx="150" cy="160" r="${R}" fill="none" stroke="${P}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${Cc}" stroke-dashoffset="${Cc * (1 - sweep)}" transform="rotate(-90 150 160)"/>
    <rect x="132" y="20" width="36" height="20" rx="6" fill="${INK}"/>
    <line x1="150" y1="160" x2="${150 + Math.sin(sweep * Math.PI * 2) * 74}" y2="${160 - Math.cos(sweep * Math.PI * 2) * 74}" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
    <circle cx="150" cy="160" r="11" fill="${INK}"/>`
}

// ---------- Cena 3: diversos nichos (cada card entra quando o nicho é falado) ----------
const st = `fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"`
const NICHES = [
  ['clínicas', 'Clínicas', u => { // cruz + linha de batimento correndo
    const d = 'M6 78 L40 78 L52 52 L66 104 L80 30 L94 92 L104 78 L134 78', len = 260, off = len - ((u * 160) % (len * 2))
    return `<rect x="46" y="8" width="48" height="16" rx="4" fill="${P}" opacity=".18"/><path d="${d}" ${st} stroke-dasharray="${len}" stroke-dashoffset="${off}"/><circle cx="70" cy="126" r="${5 + 2 * Math.sin(u * 6)}" fill="${P}"/>`
  }],
  ['restaurantes', 'Restaurantes', u => { // prato com vapor subindo
    let s = `<ellipse cx="70" cy="112" rx="58" ry="14" ${st}/><path d="M28 104 Q70 60 112 104" ${st}/>`
    for (let k = 0; k < 3; k++) { const q = (u * 0.7 + k / 3) % 1; s += `<path d="M${50 + k * 20} ${62 - q * 40} q8 -10 0 -20 q-8 -10 0 -20" fill="none" stroke="${P}" stroke-width="5" stroke-linecap="round" opacity="${(Math.sin(q * Math.PI)).toFixed(2)}"/>` }
    return s
  }],
  ['lojas', 'Lojas', u => { // sacola que balança
    const r = Math.sin(u * 4) * 8 * Math.exp(-u * 0.3)
    return `<g transform="rotate(${r} 70 20)"><path d="M28 48 L112 48 L104 128 L36 128 Z" ${st}/><path d="M50 48 Q50 18 70 18 Q90 18 90 48" ${st}/><circle cx="70" cy="88" r="${8 + 2 * Math.sin(u * 5)}" fill="${P}"/></g>`
  }],
  ['cursos', 'Cursos', u => { // capelo com borla e play
    const b = Math.sin(u * 3) * 10
    return `<path d="M70 26 L130 52 L70 78 L10 52 Z" ${st}/><path d="M34 64 L34 96 Q70 120 106 96 L106 64" ${st}/><line x1="122" y1="56" x2="${122 + b * 0.4}" y2="98" stroke="${P}" stroke-width="6" stroke-linecap="round"/><circle cx="${122 + b * 0.4}" cy="102" r="7" fill="${P}"/>`
  }],
  ['imobiliárias', 'Imobiliárias', u => { // casa com janela acendendo
    const on = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(u * 3))
    return `<path d="M14 66 L70 18 L126 66" ${st}/><path d="M28 56 L28 126 L112 126 L112 56" ${st}/><rect x="56" y="86" width="28" height="40" rx="3" ${st}/><rect x="84" y="62" width="18" height="18" rx="3" fill="${P}" opacity="${on.toFixed(2)}"/>`
  }],
  ['prestadores', 'Serviços', u => { // engrenagem girando
    let teeth = ''
    for (let k = 0; k < 8; k++) teeth += `<rect x="62" y="12" width="16" height="22" rx="4" fill="${INK}" transform="rotate(${k * 45} 70 70)"/>`
    return `<g transform="rotate(${u * 60} 70 70)">${teeth}<circle cx="70" cy="70" r="40" ${st}/><circle cx="70" cy="70" r="14" fill="${P}"/></g>`
  }]
]
$('grid').innerHTML = NICHES.map((n, i) => `<div class="niche shadow" id="n${i}" style="left:${i % 2 ? 560 : 90}px;top:${430 + Math.floor(i / 2) * 310}px"><svg viewBox="0 0 140 140" id="ni${i}"></svg><span class="n">0${i + 1}</span><b>${n[1]}</b></div>`).join('')
const sceneNiches = t => {
  // "além de sites" (janela de site) → "também motion" (o site ganha animação) → "para diversos nichos" (cards)
  const a = S.niches.a, t1 = wt('niches', 'eu', 0.17) - 0.1, tv = wt('niches', 'vídeos', 0.25), t2 = wt('niches', 'nichos', 0.4) - 0.5
  const heads = [['nh0', a - 0.1, t1], ['nh1', t1, t2], ['nh', t2, Infinity]]
  heads.forEach(([id, s, e]) => {
    const pin = spring(t - s), out = ease(span(t, e - 0.2, 0.3))
    $(id).style.opacity = t >= s - 0.05 ? clamp((t - s + 0.05) * 6, 0, 1) * (1 - out) : 0
    $(id).style.transform = `translateY(${(1 - pin) * 60 - out * 60}px)`
  })
  const pb = spring(t - a + 0.05), gone = ease(span(t, t2 - 0.1, 0.45))
  $('browser').style.opacity = 1 - gone
  $('browser').style.transform = `translateY(${(1 - pb) * 300 - gone * 120}px) scale(${(0.9 + 0.1 * pb) * (1 - gone * 0.25)})`
  // no "vídeos" o topo do site vira motion: o texto sai e entram formas animadas
  const pm = ease(span(t, tv - 0.2, 0.5)), u = Math.max(0, t - tv + 0.2)
  $('bhero').style.background = pm > 0 ? P : ''
  $('bhero').querySelectorAll('.bt,.bbtn').forEach((el, i) => { el.style.opacity = 1 - pm; el.style.transform = `translateX(${-pm * 80 * (i + 1)}px)` })
  const T = (u * 1.3) % 1, by = 220 - 150 * (1 - Math.pow(2 * T - 1, 2)), sq = T < 0.08 || T > 0.92 ? 1.3 : 1
  $('bart').innerHTML = pm <= 0 ? '' : `<g opacity="${pm}">${[0, 1, 2].map(i => `<rect x="${110 + i * 190}" y="60" width="60" height="60" rx="14" fill="none" stroke="#fff" stroke-width="7" transform="rotate(${u * 110 + i * 30} ${140 + i * 190} 90)"/>`).join('')}
    <line x1="60" y1="256" x2="620" y2="256" stroke="#ffffff66" stroke-width="4" stroke-linecap="round"/><ellipse cx="340" cy="${by}" rx="${32 * sq}" ry="${32 / sq}" fill="#fff"/></g>`
  NICHES.forEach((n, i) => {
    const tk = wt('niches', n[0], 0.35 + i * 0.1) - 0.15, u = t - tk, p = spring(u), el = $('n' + i)
    el.style.opacity = clamp(u * 5, 0, 1)
    el.style.transform = `translateY(${(1 - p) * 90}px) scale(${0.85 + 0.15 * p})`
    el.style.borderColor = u > 0 && u < 0.9 ? P : LINE
    $('ni' + i).innerHTML = n[2](Math.max(0, u))
  })
}

// ---------- Cena 4: reels, anúncios, vinhetas + linha do tempo + formatos ----------
const PILLS = [['reels', 'Reels'], ['anúncios', 'Anúncios'], ['vinhetas', 'Vinhetas']]
$('pills').innerHTML = PILLS.map((p, i) => `<span class="pill shadow" id="pl${i}">${p[1]}</span>`).join('')
$('l0').innerHTML = [[10, 150, P], [180, 200, P2], [400, 150, '#8f84e0']].map(([x, w, c]) => `<div class="abs" style="left:${x}px;top:16px;width:${w}px;height:64px;border-radius:14px;background:${c}"><div style="margin:16px 18px 0;height:10px;width:70%;border-radius:5px;background:#ffffff55"></div><div style="margin:10px 18px 0;height:10px;width:45%;border-radius:5px;background:#ffffff55"></div></div>`).join('')
$('l1').innerHTML = Array.from({ length: 56 }, (_, i) => `<i class="abs" style="left:${8 + i * 11.5}px;width:6px;border-radius:3px;background:${P}"></i>`).join('')
$('l2').innerHTML = Array.from({ length: 28 }, (_, i) => `<i class="abs" style="left:${10 + i * 23}px;bottom:14px;width:14px;border-radius:4px;background:${INK}"></i>`).join('')
const waveBars = [...$('l1').children], eqBars = [...$('l2').children]
const FORMATS = [[180, 320, '9:16', 'Reels · TikTok'], [270, 270, '1:1', 'Feed'], [420, 236, '16:9', 'YouTube']]
const sceneDetails = t => {
  const a = S.details.a, b = S.details.b
  const tp = PILLS.map((p, i) => wt('details', p[0], 0.05 + i * 0.12))
  tp.forEach((tk, i) => { const u = t - tk + 0.1, p = spring(u), el = $('pl' + i)
    el.style.opacity = clamp(u * 5, 0, 1); el.style.transform = `translateY(${(1 - p) * -40}px)`
    const nxt = tp[i + 1] ?? wt('details', 'com', 0.4); el.className = 'pill shadow' + (t >= tk - 0.05 && t < nxt - 0.05 ? ' on' : '') })
  const tt = [wt('details', 'roteiro', 0.4), wt('details', 'narração', 0.5), wt('details', 'trilha', 0.62)]
  const pp = spring(t - tt[0] + 0.5)
  $('panel').style.transform = `translateY(${(1 - pp) * 160}px)`; $('panel').style.opacity = clamp((t - tt[0] + 0.6) * 4, 0, 1)
  tt.forEach((tk, i) => { const p = spring(t - tk + 0.1); $('t' + i).style.opacity = clamp((t - tk + 0.15) * 5, 0, 1); $('t' + i).style.transform = `translateX(${(1 - p) * 200}px)` })
  ;[...$('l0').children].forEach((el, i) => { const p = spring(t - tt[0] - i * 0.12); el.style.transform = `translateX(${(1 - p) * 600}px)` })
  waveBars.forEach((el, i) => { const h = 10 + 62 * Math.abs(Math.sin(i * 0.9 + t * 6) * Math.sin(i * 0.23 + t * 1.8)) * ease(span(t, tt[1] - 0.1, 0.5)); el.style.height = h + 'px'; el.style.top = (48 - h / 2) + 'px' })
  eqBars.forEach((el, i) => { el.style.height = (8 + 56 * (0.5 + 0.5 * Math.sin(t * 7 + i * 1.7)) * (0.4 + 0.6 * hash(i)) * ease(span(t, tt[2] - 0.1, 0.5))) + 'px' })
  const head = easeIO(span(t, tt[0], b - tt[0])); $('ph').style.left = (210 + head * 680) + 'px'
  $('tc').textContent = `00:${String(Math.floor(head * 30)).padStart(2, '0')}`
  // formatos: 9:16 → 1:1 → 16:9
  const tf = [wt('details', 'formato', 0.74), wt('details', 'certo', 0.8) + 0.15, wt('details', 'cada', 0.88)]
  $('fmt').style.opacity = t > tf[0] - 0.15 ? 1 : 0; $('fmt').style.transform = `scale(${spring(t - tf[0] + 0.15)})`
  let k = 0; for (let i = 1; i < 3; i++) if (t >= tf[i]) k = i
  const p = k ? spring(t - tf[k]) : 1, from = FORMATS[Math.max(0, k - 1)], to = FORMATS[k]
  const w = lerp(from[0], to[0], p), h = lerp(from[1], to[1], p)
  $('frame').style.width = w + 'px'; $('frame').style.height = h + 'px'; $('frame').style.margin = `${-h / 2}px 0 0 ${-w / 2}px`
  $('fl').innerHTML = `${to[2]}<small>${to[3]}</small>`
  $('fl').style.transform = `translateY(${(1 - spring(t - tf[k] + 0.05)) * 24}px)`
}

// ---------- Cena 5: "este vídeo?" → marca → WhatsApp ----------
const sceneClose = t => {
  const a = S.close.a, tv = wt('close', 'vídeo', 0.1), tf = wt('close', 'foi', 0.3) - 0.1, tc = wt('close', 'chama', 0.57) - 0.1, tm = wt('close', 'movimento', 0.9)
  // fase A: a tela vira um celular (o vídeo dentro do vídeo)
  const pa = spring(t - a + 0.1), out = ease(span(t, tf - 0.15, 0.45))
  $('mini').style.opacity = t < tf + 0.35 ? 1 : 0
  $('mini').style.transform = `scale(${lerp(2.3, 1, pa) * (1 - out)}) rotate(${out * 16}deg)`
  let m = ''
  for (let i = 0; i < 5; i++) { const u = t - a + i * 0.3, x = 250 + Math.sin(u * 1.5 + i) * 140, y = 440 + Math.cos(u * 1.2 + i * 1.3) * 280
    m += `<g transform="translate(${x} ${y}) rotate(${u * 60})"><rect x="-32" y="-32" width="64" height="64" rx="${i % 2 ? 32 : 12}" fill="${i % 2 ? P : 'none'}" stroke="${i % 2 ? 'none' : INK}" stroke-width="6"/></g>` }
  $('minisvg').innerHTML = m
  $('q').style.opacity = (t > tv - 0.25 ? 1 : 0) * (1 - out); $('q').style.transform = `scale(${0.6 + 0.4 * spring(t - tv + 0.2)})`
  // fase B: marca
  const pl = spring(t - tf), pn = spring(t - tf - 0.25), lift = ease(span(t, tc - 0.2, 0.5))
  $('logo').style.opacity = t > tf ? 1 : 0; $('logo').style.transform = `translateY(${-lift * 40}px) scale(${pl}) rotate(${(1 - pl) * -120}deg)`
  const R = 140, Cc = 2 * Math.PI * R
  $('logosvg').innerHTML = `<circle cx="150" cy="150" r="${R}" fill="none" stroke="${P}" stroke-width="4" stroke-dasharray="${Cc / 24} ${Cc / 24}" transform="rotate(${(t - tf) * 40} 150 150)"/>`
  $('name').style.opacity = clamp((t - tf - 0.2) * 5, 0, 1); $('name').style.transform = `translateY(${(1 - pn) * 70 - lift * 40}px)`
  $('role').style.opacity = clamp((t - tf - 0.45) * 4, 0, 1); $('role').style.transform = `translateY(${-lift * 40}px)`
  // fase C: WhatsApp
  const pw = spring(t - tc), beat = t > tm ? 1 + 0.04 * Math.sin((t - tm) * 8) * Math.exp(-(t - tm) * 1.5) : 1
  $('wa').style.opacity = t > tc ? 1 : 0; $('wa').style.transform = `scale(${pw * beat})`
  ;['r1', 'r2'].forEach((id, i) => { const q = ((t - tc - 0.4 - i * 0.7) % 1.4 + 1.4) % 1.4 / 1.4; $(id).style.opacity = t > tc + 0.4 ? (1 - q) * 0.6 : 0; $(id).style.transform = `scale(${1 + q * 0.2}, ${1 + q * 0.5})` })
  $('contact').style.opacity = clamp((t - tc - 0.5) * 4, 0, 1); $('contact').style.transform = `translateY(${(1 - spring(t - tc - 0.5)) * 36}px)`
}

// explosões discretas nos momentos fortes
const addBurst = (t, x, y, n, power) => bursts.push({ t, x, y, n, power, seed: bursts.length * 101 + 7 })
addBurst(wt('hook', 'parar', 0.5) + 0.12, 540, 800, 18, 0.7)
addBurst(wt('reveal', 'motion', 0.15) + 0.25, 540, 690, 30, 0.9)
addBurst(wt('close', 'foi', 0.3), 540, 480, 26, 0.8)
addBurst(wt('close', 'movimento', 0.9), 540, 1035, 34, 1)

const SCENES = { hook: sceneHook, reveal: sceneReveal, niches: sceneNiches, details: sceneDetails, close: sceneClose }
window.render = frame => {
  const t = frame / FPS, cur = sceneOf(t)
  drawBg(t)
  for (const n of names) $(n).style.display = n === cur ? 'block' : 'none'
  SCENES[cur](t)
  drawFx(t)
  drawCaption(t)
  $('brand').style.opacity = clamp((t - 0.25) * 4, 0, 1) * (1 - span(t, wt('close', 'foi', 0.3) - 0.3, 0.3))
  $('brand').style.transform = `translateY(${(1 - spring(t - 0.3)) * -80}px)`
  const fade = Math.min(span(t, 0, 0.3), 1 - span(t, TOTAL - 0.6, 0.6))
  document.querySelector('.stage').style.opacity = fade
}
</script>
</body></html>
